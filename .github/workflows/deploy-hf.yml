name: Deploy Backend to Hugging Face

on:
  push:
    branches:
      - main
      - master
    paths:
      - "strumm/apps/api/**"
      - ".github/workflows/deploy-hf.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Configure Hugging Face Credentials
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global credential.helper store
          echo "https://Agnibha07:${HF_TOKEN}@huggingface.co" > ~/.git-credentials

      - name: Clone Space
        run: |
          git clone https://huggingface.co/spaces/Agnibha07/Strumm hf-space

      - name: Clean Space
        run: |
          find hf-space -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +

      - name: Copy Backend
        run: |
          rsync -av --delete \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="__pycache__" \
            --exclude="*.pyc" \
            --exclude=".pytest_cache" \
            --exclude=".mypy_cache" \
            --exclude=".ruff_cache" \
            --exclude=".venv" \
            --exclude="venv" \
            --exclude=".env" \
            --exclude=".DS_Store" \
            strumm/apps/api/ hf-space/

      - name: Commit Changes
        run: |
          cd hf-space
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          git commit -m "Auto deploy from GitHub"

      - name: Push Changes
        run: |
          cd hf-space
          git push origin HEAD:main