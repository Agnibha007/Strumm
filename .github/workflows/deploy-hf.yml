name: Deploy Backend to Hugging Face

on:
  push:
    branches:
      - main
      - master
    paths:
      - "strumm/apps/api/**"
      - ".github/workflows/deploy-hf.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Clone Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://oauth2:${HF_TOKEN}@huggingface.co/spaces/Agnibha07/Strumm hf-space

      - name: Clean Hugging Face Space
        run: |
          find hf-space -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            -exec rm -rf {} +

      - name: Copy Backend
        run: |
          rsync -av --delete \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="__pycache__" \
            --exclude="*.pyc" \
            --exclude=".pytest_cache" \
            --exclude=".mypy_cache" \
            --exclude=".ruff_cache" \
            --exclude=".venv" \
            --exclude="venv" \
            --exclude=".env" \
            --exclude=".DS_Store" \
            strumm/apps/api/ \
            hf-space/

      - name: Configure Hugging Face Remote
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd hf-space
          git remote set-url origin https://oauth2:${HF_TOKEN}@huggingface.co/spaces/Agnibha07/Strumm

      - name: Commit and Push
        run: |
          cd hf-space

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          git commit -m "Deploy backend from GitHub Actions"

          git push origin main
