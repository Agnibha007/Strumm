name: Deploy Backend to Hugging Face

on:
  push:
    branches:
      - main
      - master
    paths:
      - "strumm/apps/api/**"
      - ".github/workflows/deploy-hf.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Clone Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://oauth2:${HF_TOKEN}@huggingface.co/spaces/Agnibha07/Strumm hf-space

      - name: Clean Hugging Face Space
        run: |
          find hf-space -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            -exec rm -rf {} +

      - name: Copy Backend
        run: |
          rsync -av \
            --delete \
            --exclude=".git" \
            strumm/apps/api/ \
            hf-space/

      - name: Commit & Push
        run: |
          cd hf-space

          git add .

          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Auto deploy from GitHub Actions"
            git push origin main
          fi