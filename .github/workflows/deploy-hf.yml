name: Deploy Backend to Hugging Face

on:
  push:
    branches:
      - main
      - master
    paths:
      - "strumm/apps/api/**"
      - ".github/workflows/deploy-hf.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Check Secret
        env:
          HF_SSH_KEY: ${{ secrets.HF_SSH_KEY }}
        run: |
          if [ -z "$HF_SSH_KEY" ]; then
            echo "EMPTY"
            exit 1
          else
            echo "FOUND"
            echo "Length: ${#HF_SSH_KEY}"
          fi
      - name: Configure SSH
        env:
          HF_SSH_KEY: ${{ secrets.HF_SSH_KEY }}
        run: |
          set -x
        
          mkdir -p ~/.ssh
        
          printf "%s" "$HF_SSH_KEY" > ~/.ssh/id_ed25519
        
          ls -la ~/.ssh
        
          chmod 600 ~/.ssh/id_ed25519
        
          cat ~/.ssh/id_ed25519 | head -2
        
          ssh-keyscan huggingface.co >> ~/.ssh/known_hosts
        
          ssh -T git@huggingface.co || true

      - name: Clone Space
        run: |
          git clone git@huggingface.co:spaces/Agnibha07/Strumm.git hf-space

      - name: Clean Space
        run: |
          find hf-space -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            -exec rm -rf {} +

      - name: Copy Backend
        run: |
          rsync -av --delete \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="__pycache__" \
            --exclude="*.pyc" \
            --exclude=".pytest_cache" \
            --exclude=".mypy_cache" \
            --exclude=".ruff_cache" \
            --exclude=".venv" \
            --exclude="venv" \
            --exclude=".env" \
            --exclude=".DS_Store" \
            strumm/apps/api/ \
            hf-space/

      - name: Commit & Push
        run: |
          cd hf-space

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          git commit -m "Deploy backend from GitHub Actions"

          git push origin HEAD:main
