name: Temporary HF Space Build Log Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-build-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face client
        run: python -m pip install --disable-pip-version-check "huggingface_hub>=1.21.0"

      - name: Retrieve authenticated Space build logs
        env:
          HF_DEPLOY_TOKEN: ${{ secrets.HF_DEPLOY_TOKEN }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          python - <<'PY'
          import os
          import sys
          from collections import deque
          from huggingface_hub import HfApi

          token = os.environ.get("HF_DEPLOY_TOKEN")
          space_id = os.environ.get("HF_SPACE_NAME")
          if not token or not space_id:
              raise SystemExit("Required Hugging Face deployment secrets are missing.")

          print(f"Fetching the current Docker build log for {space_id}.")
          api = HfApi(token=token)
          lines = deque(api.fetch_space_logs(repo_id=space_id, build=True, token=token), maxlen=400)
          if not lines:
              print("Hugging Face returned no buffered build-log lines.")
          else:
              for line in lines:
                  sys.stdout.write(line)
          sys.stdout.flush()
          PY
