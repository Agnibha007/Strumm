services:
  - type: web
    name: strumm-api
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: STRUMM_APP_URL
        value: https://strumm.me
      - key: ALLOWED_ORIGINS
        value: https://strumm.me,https://www.strumm.me
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_SERVER
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: SENDER_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENDER_FROM
        sync: false
      - key: EXPOSE_DEV_OTP
        sync: false
      - key: DNS_NAMESERVERS
        value: 1.1.1.1,8.8.8.8
      # Backblaze B2 object storage (private bucket)
      - key: B2_ENDPOINT
        value: https://s3.eu-central-003.backblazeb2.com
      - key: B2_REGION
        value: eu-central-003
      - key: B2_BUCKET_NAME
        value: strumm-media-prod
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false